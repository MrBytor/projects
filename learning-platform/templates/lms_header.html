<header class="platform-header lms-topbar" data-account-id="{{ user.pk }}">
<a class="lms-brand" href="{% url 'dashboard' %}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v15M12 5C8 2 4 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-2-1-6-2-10 1Z"/></svg>Eurasia Learning</a>
<nav class="lms-topnav" aria-label="Main learning navigation"><a href="{% url 'dashboard' %}"{% if nav_section == 'overview' %} aria-current="page"{% endif %}>Dashboard</a><a href="{% url 'student_courses' %}"{% if nav_section == 'courses' or workspace_course %} aria-current="page"{% endif %}>Courses</a><a href="{% url 'student_calendar' %}"{% if nav_section == 'calendar' %} aria-current="page"{% endif %}>Calendar</a></nav>
<div class="lms-account"><a href="{% url 'password' %}" title="Change password">{{ user.first_name|default:user.username }} <span>· {% if user.is_staff %}Teacher{% else %}Student{% endif %}</span></a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="lms-signout">Sign out</button></form></div></header>
